services:
  tg-pro-downloader:
    build:
      context: .
      args:
        HTTP_PROXY: ${BUILD_HTTP_PROXY:-}
        HTTPS_PROXY: ${BUILD_HTTPS_PROXY:-}
    container_name: tg-pro-downloader
    restart: unless-stopped
    ports:
      - "8082:8080"   # WebUI 管理后台端口（宿主 8082 -> 容器 8080，避开已占用的 8080）
    volumes:
      - ./config:/app/config_store
      - ./sessions:/app/sessions
      - ./downloads:/app/save
      # 设计文档 §6：持久化 rclone.conf，避免重建容器后网盘凭据/remote 丢失
      - ./rclone:/root/.config/rclone
      # TGFS 集成：面板在这里生成 TGFS 的 config.yaml，TGFS 容器读同一份
      - ./tgfs_data:/app/tgfs_data
      # TGFS 集成：面板通过 Docker API 重启 tgfs 容器（代码里只放行白名单容器名）
      - /var/run/docker.sock:/var/run/docker.sock
    extra_hosts:
      # TGFS 跑在 host 网络、监听宿主 1900，面板从桥接网络要用这个别名访问
      - "host.docker.internal:host-gateway"
    environment:
      - TZ=Asia/Shanghai
      # 密钥由本地 .env 提供（复制 .env.example 后自行生成强随机值）
      - JWT_SECRET=${JWT_SECRET:?请在 .env 中设置 JWT_SECRET}
      - OTP_SECRET=${OTP_SECRET:?请在 .env 中设置 OTP_SECRET}

  # ==================== TGFS（把 Telegram 当网盘，对外提供 WebDAV） ====================
  # 由面板「网盘与存储 → TGFS 服务」生成 config.yaml 并控制启停。
  #
  # 为什么用 host 网络：Pyrogram 不读 HTTP_PROXY 环境变量，只能在 Client 构造里显式
  # 指定 SOCKS5；而宿主的代理只监听 127.0.0.1:1080，桥接网络够不到宿主 loopback。
  # 走 host 网络后容器直接复用宿主代理，也不必再挂一个 socat 中继。
  tgfs:
    build:
      context: ./tgfs_patch
      args:
        TGFS_BASE: ${TGFS_IMAGE:-docker.1ms.run/wheatcarrier/tgfs:latest}
    image: tg-pro-tgfs:local
    container_name: tgfs
    # 没有 config.yaml 时官方镜像会直接退出（FileNotFoundError），如果配 unless-stopped
    # 就会变成无限重启循环。所以先用一个等待循环占住，等面板写好配置再 exec 真正的入口；
    # 这样既不会空转重启，NAS 重启后也能自动恢复。
    restart: unless-stopped
    command:
      - sh
      - -c
      - |
        while [ ! -f /data/config.yaml ]; do
          echo "$$(date '+%F %T') 等待面板生成 /data/config.yaml …"
          sleep 30
        done
        exec python main.py
    network_mode: host
    volumes:
      - ./tgfs_data:/data
    environment:
      - TZ=Asia/Shanghai
      - TGFS_DATA_DIR=/data
      - TGFS_CONFIG_FILE=config.yaml
